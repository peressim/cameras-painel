version: "3"
  #inner version:2.2.1
services:
  kafka:
    restart: always
    container_name: kafka
    image: hb.jimiops.top/iothub/jimi-kafka:5.0.3
    ports:
      - "9092:9092"
    volumes:
      - "/iothub/kafka:/kafka"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
      HOSTNAME: kafka
    depends_on:
      - zookeeper
    deploy:
      resources:
         limits:
            cpus: '2'
            memory: 2G
         reservations:
            memory: 1G
    networks:
      - backend

  mongodb:
    restart: always
    container_name: mongodb
    image: hb.jimiops.top/iothub/jimi-mongo:5.0.1
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: jimi@123
    volumes:
      - "/iothub/mongoDB:/data/db"
    networks:
      - backend

  redis:
    restart: always
    container_name: redis
    image: hb.jimiops.top/iothub/jimi-redis:5.0.1
    ports:
      - "6379:6379"
    volumes:
      - "/iothub/redis:/data"
    command: redis-server --requirepass jimi@123 --appendonly yes
    networks:
      - backend

  zookeeper:
    restart: always
    container_name: zookeeper
    image: hb.jimiops.top/iothub/jimi-zookeeper:5.0.3
    ports:
      - "2181:2181"
    volumes:
      - "/iothub/zookeeper/data:/data"
      - "/iothub/zookeeper/datalog:/datalog"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - backend

  api:
    restart: always
    container_name: api
    image: hb.jimiops.top/iothub/tracker-dvr-api_sa:99791f13
    ports:
      - "9080:9080"
    volumes:
      - "/iothub/api/:/app/tracker-dvr-api/logs"
      - "/iothub/api/data/:/app/data"
    links:
      - router
      - redis
    depends_on:
      - router
    environment:
      - routeHost=router
      - redisHost=redis
      - redisPassword=jimi@123
      - mongoHost=mongodb
      - mongodbUser=root
      - mongodbPassword=jimi@123
      - offlineCmdPushURL=https://camsec.netlify.app/pushalarm
      - offlineCmdPushToken=a12341234123
      - storageLimit=false
      - storageLimitPath=/app/data
      - systemLogStorageLimitDays=180
      - userDataStorageLimitDays=180
      - mediaStorageLimitDays=180
      - pushEnable=false
      - dayPushTimes=2
      - pushJimiUrl=https://tbms.jimiiot.com/iothubApi
      - jimiPushToken=y8RsBPNwywHvBAnjLG0k2A==
      - mediaServerUrl=http://iothub-media:8880/index/api/getNetworkFlowAndConcurrency
      - mediaServerSecret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
      - loginCleanMediaCache=false
    networks:
      - backend

  tracker-instruction-server:
    restart: always
    container_name: tracker-instruction-server
    image: hb.jimiops.top/iothub/tracker-instruction-server_sa:76268425
    ports:
      - "10088:10088"
    volumes:
      - "/iothub/tracker-instruction-server/:/app/tracker-instruction-server/logs"
    links:
      - router
      - redis
    depends_on:
      - router
      - redis
    environment:
      - routeHost=router
      - redisHost=redis
      - redisPassword=jimi@123
      - redisDB=9
      - kafkaHost=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - offlineCmdPushURL=https://camsec.netlify.app/pushalarm
      - offlineCmdPushToken=a12341234123
      - JVM_OPTS=-Xms512m -Xmx1024m
    networks:
      - backend

  msg-dispatch-iothub:
    restart: always
    container_name: msg-dispatch-iothub
    image: hb.jimiops.top/iothub/msg-dispatch-iothub_sa:99791f13
    ports:
      - "10066:10066"
    volumes:
      - "/iothub/msg-dispatch-iothub/:/app/msg-dispatch-iothub/logs"
    links:
      - kafka
    depends_on:
      - kafka
    environment:
      - apollo=false
      - kafkaHost=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      # Alertas enviados para o painel Netlify
      - pushURL=https://camsec.netlify.app/pushalarm
      - pushToken=a12341234123
      - LICENSE_NOTIFY_EMAIL=peressim.hugo@gmail.com
      - httpPushEncrypt=false
      - httpPushSecret=JiMi@20232012345
      - newMileagePush=false
      - JVM_OPTS=-Xms512m -Xmx1024m
      - logInfo1Enable=true
      - logInfo2Enable=true
      - logInfo3Enable=true
      - redisHost=redis
      - redisPort=6379
      - redisPasswd=jimi@123
      - jttProtocolGate=jimi-gateway-450s
    networks:
      - backend

  dvr-upload:
    restart: always
    container_name: dvr-upload
    image: hb.jimiops.top/iothub/dvr-upload_sa:31e8aa09
    ports:
      - "23010:23010"
    volumes:
      - "/iothub/dvr-upload/logs:/app/dvr-upload/logs"
      - "/iothub/dvr-upload/uploadFile:/data/upload"
      - "/iothub/jimi-upload-process/uploadFile:/data/upload/jtt"
    environment:
      - ENABLE_SECRET=true
      - LOCAL_ENABLE=true
      - OSS_ENABLE=false
      - AWS_ENABLE=false
      - AZURE_ENABLE=false
      - GCS_ENABLE=false
      - pushURL=https://camsec.netlify.app/pushalarm
      - pushToken=a12341234123
      - redisHost=redis
      - redisPort=6379
      - redisPasswd=jimi@123
    networks:
      - backend

  tracker-gate-v1:
    restart: always
    container_name: tracker-gate-v1
    image: hb.jimiops.top/iothub/tracker-gate-v1_sa:0a5e9d8c
    ports:
      - "21100:21100"
    volumes:
      - "/iothub/license:/app/tracker-gate-v1/conf/license"
      - "/iothub/tracker-gate-v1/logs:/app/tracker-gate-v1/logs"
    links:
      - router
      - redis
    depends_on:
      - router
    environment:
      - gateId=tracker-gate-v1-93
      - routeHost=router
      - redisHost=redis
      - redisPort=6379
      - redisPassword=jimi@123
      - kafkaHost=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - kafkaEnable=true
      - lbsURL=http://xxxy
      - lbsToken=a3bfe487e6ae029fb02402e6cb2ceacc
      - logInfo1Enable=true
      - logInfo2Enable=true
      - logInfo3Enable=true
      - checkDeviceImport=false
      - reloadImei=false
      - collectIothubMetric=false
      - hbConnectionFailedSleep=false
    networks:
      - backend

  jimi-gateway-v541h:
    restart: always
    container_name: jimi-gateway-v541h
    image: hb.jimiops.top/iothub/tracker-gate-v541h_sa:8c360419
    ports:
      - "31506:31506"
    volumes:
      - "/iothub/license/:/app/tracker-gate-v541h/conf/license/"
      - "/iothub/tracker-gate-v541h/logs:/app/tracker-gate-v541h/logs"
    links:
      - router
      - redis
    depends_on:
      - router
    environment:
      - gateId=gate-541h-93
      - routeHost=router
      - redisHost=redis
      - redisPort=6379
      - redisPasswd=jimi@123
      - kafkaHost=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - kafkaConsumerGroup=v541h-group
      - checkDeviceImport=false
      - reloadImei=false
      - collectIothubMetric=false
      - hbConnectionFailedSleep=false
    networks:
      - backend

  # Gateway principal para JC400 (protocolo c450)
  jimi-gateway-450:
    restart: always
    container_name: jimi-gateway-450
    image: hb.jimiops.top/iothub/tracker-gate-iothub-c450_sa:76268425
    ports:
      - "21122:21121"
    volumes:
      - "/iothub/license/:/app/tracker-gate-iothub-c450/conf/license/"
      - "/iothub/gate-iothub-c450/logs:/app/tracker-gate-iothub-c450/logs"
    links:
      - router
      - redis
    depends_on:
      - router
    environment:
      - gateId=jimi-gateway-450-21122-93
      - routeHost=router
      - redisHost=redis
      - redisPort=6379
      - redisPasswd=jimi@123
      - kafkaHost=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - kafkaConsumerGroup=data-128
      - kafkaEnable=true
      - connectTimeout=5
      - readTimeOut=5
      - writeTimeOut=5
      - newImeiRule=true
      - loginCleanMediaCache=false
      - checkDeviceImport=false
      - reloadImei=false
      - collectIothubMetric=false
      - hbConnectionFailedSleep=false
    networks:
      - backend

  # Servidor de mídia: recebe RTMP da câmera e serve FLV para o browser
  iothub-media:
    restart: always
    container_name: iothub-media
    image: hb.jimiops.top/iothub/iothub-media:9b34791b
    deploy:
      resources:
         limits:
            cpus: '2'
            memory: 4G
         reservations:
            memory: 2G
    ports:
      - "8881:8880"   # HTTP-FLV para o browser
      - "1936:1935"   # RTMP recebe stream da câmera
      - "10002:10000"
      - "10003:10001"
    environment:
      - newImeiRule=true
    volumes:
      - "/iothub/iothub-media/log:/log"
      - "/iothub/license/jimi-license.lic:/jimi-license.lic"
      - "/iothub/iothub-media/cer/:/cer"
    networks:
      - backend

  jimi-data:
    restart: always
    container_name: jimi-data
    image: hb.jimiops.top/iothub/tracker-data-mongo_sa:76268425
    volumes:
      - "/iothub/jimi-data/:/app/tracker-data-mongo/logs"
    links:
      - kafka
      - mongodb
    depends_on:
      - kafka
      - mongodb
    environment:
      - kafka=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - mongoHost=mongodb
      - mongoPort=27017
      - mongoUser=root
      - mongoPass=jimi@123
      - mongoTtlday=2
    networks:
      - backend

  jimi-tracker-gate-upload:
    restart: always
    container_name: jimi-tracker-gate-upload
    image: hb.jimiops.top/iothub/tracker-gate-upload_sa:76268425
    ports:
      - "21188:21188"
    volumes:
      - "/iothub/jimi-tracker-gate-upload:/app/tracker-gate-upload/logs"
    depends_on:
      - redis
      - kafka
    environment:
      - redisHost=redis
      - redisPasswd=jimi@123
      - redisPort=6379
      - kafkaUrl=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
      - newImeiRule=true
      - pushUploadStatusURL=https://camsec.netlify.app/pushalarm
      - pushUploadStatusToken=a12341234123
      - connectTimeout=5
      - readTimeOut=5
      - writeTimeOut=5
      - httpPushEncrypt=false
      - httpPushSecret=JIMI@20231234567
    networks:
      - backend

  jimi-tracker-upload-process:
    restart: always
    container_name: jimi-tracker-upload-process
    image: hb.jimiops.top/iothub/tracker-upload-process_sa:76268425
    volumes:
      - "/iothub/jimi-upload-process/logs:/app/tracker-upload-process/logs"
      - "/iothub/jimi-upload-process/uploadFile:/temp"
    depends_on:
      - redis
      - kafka
    environment:
      - redisHost=redis
      - redisPasswd=jimi@123
      - redisPort=6379
      - kafkaUrl=kafka:9092
      - kafkaAuthSwitch=false
      - kafkaAuthUserName=admin
      - kafkaAuthPassword=123456
    networks:
      - backend

  router:
    restart: always
    container_name: router
    image: hb.jimiops.top/iothub/tracker-route-server_sa:0d70cf5f
    ports:
      - "21200:21200"
    volumes:
      - "/iothub/router/logs:/app/tracker-route-server/logs"
    depends_on:
      - redis
    environment:
      - redisHost=redis
      - redisPasswd=jimi@123
      - redisPort=6379
      - loginRedisDB=2
    networks:
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet:  172.16.13.0/24
